<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="Panel de accesos directos CREATA Muebles.">
    <title>Panel CREATA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./panel-styles.css?v=3">
</head>
<body>

    <!-- ACCESO EXCLUSIVO -->
    <section id="hubGateBackdrop" class="gate-backdrop">
        <div class="gate-card">
            <div class="gate-head">
                <img data-creata-logo alt="CREATA" class="gate-logo">
                <h2>Panel CREATA</h2>
            </div>

            <form id="hubLoginForm" class="gate-form" onsubmit="submitHubOwnerLogin(event)">
                <div id="hubGateAlert" class="gate-alert hidden" role="alert"></div>

                <input
                    id="hubOwnerEmail"
                    type="email"
                    class="text-input"
                    value="kevin.reyna@grupoanipa.com"
                    readonly
                    autocomplete="username"
                >

                <div class="input-wrap">
                    <input
                        id="hubOwnerPassword"
                        type="password"
                        class="text-input"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    >
                    <button id="btnToggleHubPwd" type="button" class="pwd-toggle" onclick="toggleHubPwdVisibility()">Ver</button>
                </div>

                <button id="btnHubLoginSubmit" type="submit" class="btn-gold">Entrar</button>
            </form>
        </div>
    </section>

    <!-- PANEL MINIMALISTA DE BOTONES DIRECTOS -->
    <div id="hubMainShell" class="hidden">
        <header class="top-bar">
            <div class="top-bar-inner">
                <div class="brand-left">
                    <img data-creata-logo alt="CREATA" class="brand-logo">
                    <h1>Panel CREATA</h1>
                </div>
                <button type="button" class="top-btn" onclick="lockHubPortal()">Salir</button>
            </div>
        </header>

        <main class="hub-container">
            <h2 class="section-label">Proyectos</h2>
            <nav id="projectsGridContainer" class="projects-grid" aria-label="Proyectos"></nav>

            <h2 class="section-label section-label-sheets">Google Sheets</h2>
            <nav id="sheetsGridContainer" class="projects-grid sheets-grid" aria-label="Google Sheets"></nav>
        </main>
    </div>

    <script src="./creata-logo.js?v=32"></script>
    <script src="./creata-cloud.js?v=32"></script>
    <script src="./panel-app.js?v=5"></script>
</body>
</html>
