<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>CREATA</title>
  <script>
    (function () {
      try {
        if (typeof sessionStorage !== 'undefined') {
          sessionStorage.setItem('creata_open_module', 'historial');
        }
        if (typeof localStorage !== 'undefined') {
          localStorage.setItem('creata_open_module', JSON.stringify({ module: 'historial', ts: Date.now() }));
        }
      } catch (e) {}
      window.location.replace('./inventario.html');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=./inventario.html"></noscript>
</head>

</html>
