<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Fotos · Hoja 1 | CREATA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://docs.google.com" crossorigin>
    <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./fotos-productos-styles.css?v=9">
    <script src="./creata-guard.js"></script>
</head>
<body>

    <!-- CANDADO EXCLUSIVO -->
    <section id="privateGateBackdrop" class="private-gate-backdrop">
        <div class="private-gate-card">
            <div class="private-gate-top">
                <div class="gate-brand-row" style="margin-bottom:0;">
                    <img data-creata-logo alt="CREATA" class="gate-logo">
                    <span class="gate-private-tag">Fotos</span>
                </div>
            </div>

            <form id="ownerLoginForm" class="private-gate-body" onsubmit="submitOwnerFotosLogin(event)">
                <div id="privateGateMsg" class="gate-feedback hidden" role="alert"></div>

                <div class="field-input-wrap">
                    <input
                        id="ownerEmailInput"
                        type="email"
                        class="field-input"
                        value="kevin.reyna@grupoanipa.com"
                        readonly
                        autocomplete="username"
                    >
                </div>

                <div class="field-input-wrap">
                    <input
                        id="ownerPasswordInput"
                        type="password"
                        class="field-input"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    >
                    <button id="btnToggleOwnerPwd" type="button" class="field-toggle-btn" onclick="toggleOwnerFotosPwd()">Ver</button>
                </div>

                <button id="btnOwnerLoginSubmit" type="submit" class="btn-primary-gold">Entrar</button>
            </form>
        </div>
    </section>

    <!-- INTERFAZ PRINCIPAL COMPACTA -->
    <div id="privateAppShell" class="hidden">

        <header class="exec-header">
            <div class="exec-header-inner">
                <div class="brand-cluster">
                    <img data-creata-logo alt="CREATA" class="header-logo">
                    <span class="header-divider" aria-hidden="true"></span>
                    <div class="header-titles">
                        <h1>Fotos · Hoja "1"</h1>
                    </div>
                </div>

                <div class="header-actions">
                    <a class="hdr-btn" href="./panel.html">Panel</a>
                    <a class="hdr-btn" href="./inventario.html" target="_blank" rel="noopener">Cotización ↗</a>
                    <button type="button" id="btnHeaderSyncSkus" class="hdr-btn is-accent" onclick="syncSkusNow()">↻ SKUs</button>
                    <button type="button" id="btnHeaderRefreshFotos" class="hdr-btn" onclick="refreshAllPhotoWorkspace(true)">↻ Fotos</button>
                    <a class="hdr-btn" href="https://docs.google.com/spreadsheets/d/1xewqWPOlR5LMEFQXq1KsqvObg9PPlTkRGqfZ_4Iiv-8/edit?gid=620514545#gid=620514545" target="_blank" rel="noopener">Hoja "1"</a>
                    <button type="button" class="hdr-btn" onclick="lockFotosPortal()">Salir</button>
                </div>
            </div>
        </header>

        <main class="workspace-shell">

            <!-- 2 COLUMNAS -->
            <section class="workbench-grid">

                <!-- IZQUIERDA: BUSCADOR -->
                <div class="panel-card">
                    <div class="panel-header">
                        <h2>SKU</h2>
                        <div style="display:flex;align-items:center;gap:6px;">
                            <button type="button" id="btnSyncSkusCard" class="hdr-btn is-accent" style="height:24px;padding:0 9px;font-size:10.5px;" onclick="syncSkusNow()">↻ SKUs</button>
                            <span id="skuListCountBadge" class="panel-badge">0</span>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div class="search-box-wrap">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                                <circle cx="11" cy="11" r="7"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input
                                type="search"
                                id="skuSearchInput"
                                class="search-input"
                                placeholder="SKU o Nombre..."
                                autocomplete="off"
                            >
                            <button type="button" id="skuSearchClearBtn" class="search-clear-btn hidden" onclick="clearSkuSearch()">✕</button>
                        </div>

                        <div class="filter-pills-row" style="margin-bottom:10px;">
                            <button type="button" class="filter-pill active" data-filter="ALL" onclick="setSkuFilterMode('ALL')">Todos</button>
                            <button type="button" class="filter-pill" data-filter="NO_PHOTO" onclick="setSkuFilterMode('NO_PHOTO')">Sin foto</button>
                            <button type="button" class="filter-pill" data-filter="HAS_PHOTO" onclick="setSkuFilterMode('HAS_PHOTO')">Con foto</button>
                            <button type="button" class="filter-pill" data-filter="IN_INV" onclick="setSkuFilterMode('IN_INV')">Inventario</button>
                        </div>

                        <div id="skuResultsList" class="sku-list"></div>
                    </div>
                </div>

                <!-- DERECHA: FOTOS + SUBIR COTIZACION / CARGADAS -->
                <div class="right-column-stack">

                    <div class="panel-card">
                        <div class="panel-header">
                            <h2>Producto</h2>
                            <span id="selectedRowBadge" class="panel-badge">—</span>
                        </div>
                        <div class="panel-body">

                            <div class="selected-sheet-summary">
                                <div class="sheet-col-box">
                                    <div class="sheet-col-tag">SKU (Col A)</div>
                                    <div id="selColASku" class="sheet-col-val mono">—</div>
                                </div>
                                <div class="sheet-col-box">
                                    <div class="sheet-col-tag">Nombre (Col B)</div>
                                    <div id="selColBName" class="sheet-col-val">—</div>
                                </div>
                                <div class="sheet-col-box">
                                    <div class="sheet-col-tag">Categoría</div>
                                    <div id="selCategoryLabel" class="sheet-col-val">—</div>
                                </div>
                            </div>

                            <div class="dual-preview-grid">
                                <!-- FOTO ACTUAL (CARGADA EN COL D) -->
                                <div class="photo-stage-card">
                                    <div class="photo-stage-head">
                                        <span class="photo-stage-title">Cargada (Col D)</span>
                                        <div class="stage-head-actions">
                                            <button type="button" id="curPhotoTakeBtn" class="hdr-btn is-accent hidden" style="height:24px; padding:0 8px; font-size:9.5px;" onclick="takeCurrentProductPhoto()">Tomar</button>
                                            <button type="button" id="curPhotoDeleteBtn" class="hdr-btn is-danger hidden" style="height:24px; padding:0 8px; font-size:9.5px;" onclick="deleteCurrentProductPhoto()">🗑 Borrar</button>
                                            <a id="curPhotoOpenLink" href="#" target="_blank" rel="noopener" class="hdr-btn hidden" style="height:24px; padding:0 8px; font-size:9.5px; background:#252C32; color:#FFF;">↗</a>
                                        </div>
                                    </div>
                                    <div id="curPhotoCanvas" class="photo-stage-canvas">
                                        <div class="photo-empty-placeholder">—</div>
                                    </div>
                                </div>

                                <!-- FOTO SELECCIONADA PARA ASIGNAR -->
                                <div id="newPhotoStageCard" class="photo-stage-card">
                                    <div class="photo-stage-head">
                                        <span id="newPhotoStageTitle" class="photo-stage-title">Seleccionada</span>
                                        <div class="stage-head-actions">
                                            <button type="button" id="deleteSelectedPhotoBtn" class="hdr-btn is-danger hidden" style="height:24px; padding:0 8px; font-size:9.5px;" onclick="deleteSelectedStagePhoto()">🗑 Borrar</button>
                                            <button type="button" id="clearSelectedInboxBtn" class="hdr-btn hidden" style="height:24px; padding:0 8px; font-size:9.5px; background:#252C32; color:#FFF;" onclick="clearSelectedInboxPhoto()">Quitar</button>
                                        </div>
                                    </div>
                                    <div id="newPhotoCanvas" class="photo-stage-canvas">
                                        <div class="photo-empty-placeholder">—</div>
                                    </div>
                                    <div id="newPhotoFootWrap" class="photo-stage-foot hidden">
                                        <span id="newPhotoFileText" class="photo-stage-url"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="assign-controls-bar">
                                <div class="dest-folder-picker">
                                    <label for="destFolderSelect" class="field-label" style="margin:0;">Destino:</label>
                                    <select id="destFolderSelect" class="dest-select"></select>
                                </div>

                                <button
                                    type="button"
                                    id="btnAssignPhotoNow"
                                    class="btn-primary-gold"
                                    style="padding: 0 20px;"
                                    onclick="assignSelectedPhotoToProduct()"
                                    disabled
                                >
                                    Guardar
                                </button>
                            </div>

                            <div id="assignFeedbackBox" class="assign-feedback-banner hidden"></div>
                        </div>
                    </div>

                    <!-- GALERÍA: SUBIR COTIZACION / CARGADAS -->
                    <div class="panel-card">
                        <div class="panel-header" style="flex-wrap:wrap; gap:8px;">
                            <div class="gallery-mode-tabs">
                                <button type="button" id="tabGalleryInbox" class="gallery-tab-btn active" onclick="setGalleryMode('INBOX')">
                                    <span>SUBIR COTIZACION</span>
                                    <span id="inboxHeaderBadge" class="panel-badge">0</span>
                                </button>
                                <button type="button" id="tabGalleryLoaded" class="gallery-tab-btn" onclick="setGalleryMode('LOADED')">
                                    <span>Cargadas</span>
                                    <span id="loadedHeaderBadge" class="panel-badge">0</span>
                                </button>
                            </div>
                        </div>
                        <div class="panel-body">
                            <div class="inbox-toolbar">
                                <div class="search-box-wrap" style="flex:1 1 200px; max-width:300px;">
                                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                                        <circle cx="11" cy="11" r="7"></circle>
                                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                    </svg>
                                    <input
                                        type="search"
                                        id="inboxSearchInput"
                                        class="search-input"
                                        style="height:34px; font-size:12px;"
                                        placeholder="Filtrar..."
                                        autocomplete="off"
                                    >
                                </div>

                                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                                    <label class="hdr-btn is-accent" style="cursor:pointer;">
                                        + Foto
                                        <input type="file" id="pcUploadToSubirInput" accept="image/*" multiple class="hidden" onchange="uploadLocalFilesToSubir(this)">
                                    </label>
                                    <label class="hdr-btn" style="cursor:pointer;">
                                        📁 Carpeta
                                        <input type="file" id="pcUploadFolderToSubirInput" accept="image/*" webkitdirectory directory multiple class="hidden" onchange="uploadLocalFilesToSubir(this)">
                                    </label>
                                    <button type="button" id="btnRefreshInbox" class="hdr-btn" style="background:#252C32; color:#FFF;" onclick="refreshInboxOnly(true)">↻</button>
                                </div>
                            </div>

                            <div id="inboxGalleryContainer" class="inbox-grid"></div>
                        </div>
                    </div>

                    <!-- HISTORIAL BREVE DE SESIÓN -->
                    <div id="sessionHistoryPanel" class="panel-card hidden">
                        <div class="panel-header">
                            <h2>Guardadas hoy</h2>
                            <span id="sessionSavedCountBadge" class="panel-badge">0</span>
                        </div>
                        <div class="panel-body">
                            <div id="sessionSavedList" class="session-log-list"></div>
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <div id="photoLightbox" class="lightbox-backdrop hidden" onclick="closePhotoLightbox()">
        <img id="photoLightboxImg" src="" alt="Vista" referrerpolicy="no-referrer" draggable="false">
    </div>

    <script src="./creata-logo.js?v=32"></script>
    <script src="./creata-cloud.js?v=32"></script>
    <script src="./fotos-productos-app.js?v=11"></script>
</body>
</html>
