<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>CREATA — Búsqueda de productos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --brand-white: #FFFFFF;
            --brand-charcoal: #252C32;
            --brand-bronze: #A38251;
            --brand-sand: #E1DBC5;
            --brand-ivory: #E8E4DE;
            --brand-terracotta: #E09577;
        }
        *, *::before, *::after, button, input, select {
            box-sizing: border-box;
            font-family: 'Raleway', sans-serif !important;
            font-variant-numeric: lining-nums;
        }
        body {
            margin: 0;
            background-color: var(--brand-white);
            color: var(--brand-charcoal);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .inv-header {
            background-color: var(--brand-charcoal);
            border-bottom: 1px solid var(--brand-sand);
        }
        .logo-img {
            height: 73px;
            width: auto;
            object-fit: contain;
            margin: 0 auto;
            display: block;
        }
        .inv-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 16px;
            background: #FFFFFF;
            border: 1px solid var(--brand-ivory);
            border-radius: 12px;
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
            cursor: pointer;
        }
        .inv-row:hover {
            border-color: var(--brand-bronze);
            box-shadow: 0 3px 10px rgba(37, 44, 50, 0.06);
        }
        .cart-plus-btn {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 9999px;
            border: 1px solid var(--brand-sand);
            background: var(--brand-ivory);
            color: var(--brand-charcoal);
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .cart-plus-btn:hover, .cart-plus-btn.in-cart {
            background: var(--brand-bronze);
            border-color: var(--brand-bronze);
            color: #FFFFFF;
        }
        .sem-red {
            background: #FEF2F2;
            border-color: #FECACA;
            color: #991B1B;
        }
        .sem-yellow {
            background: #FFFBEB;
            border-color: #FDE68A;
            color: #92400E;
        }
        .sem-green {
            background: #ECFDF5;
            border-color: #A7F3D0;
            color: #065F46;
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(37, 44, 50, 0.72);
            backdrop-filter: blur(4px);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }
        .modal-backdrop.open {
            display: flex;
        }
    </style>
</head>
<body>

    <header class="inv-header sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 pt-6 pb-5">
            <div class="text-center mb-6">
                <img id="headerLogoImg" src="" alt="CREATA MUEBLES" class="logo-img">
                <script src="creata-logo.js"></script>
                <script>if(window.CREATA_LOGO_B64){document.getElementById("headerLogoImg").src=window.CREATA_LOGO_B64;}</script>
            </div>

            <div class="flex items-center justify-between mb-2.5">
                <h1 class="text-sm sm:text-base font-bold tracking-wider uppercase text-white">Búsqueda de productos</h1>
                <button type="button" onclick="openCartModal()" id="headerCartBtn"
                        class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-wider transition"
                        style="background:#A38251; color:#FFFFFF;">
                    <span>Cotización</span>
                    <span id="headerCartCount" class="px-2 py-0.5 rounded-full text-[11px] font-black" style="background:#252C32; color:#FFFFFF;">0</span>
                </button>
            </div>

            <div class="relative">
                <input
                    type="search"
                    id="invSearchInput"
                    placeholder="Buscar producto o escanear SKU..."
                    autocomplete="off"
                    class="w-full rounded-full pl-10 pr-10 py-3 text-sm font-medium outline-none border transition"
                    style="background:#FFFFFF; border-color:#E1DBC5; color:#252C32;"
                >
                <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" style="color:#A38251;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z"></path>
                </svg>
                <button type="button" id="invClearBtn" onclick="clearInvSearch()" style="display:none; color:#252C32;"
                        class="absolute right-3.5 top-1/2 -translate-y-1/2 text-sm font-bold opacity-60 hover:opacity-100">✕</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-4">
        <div id="invListContainer" class="space-y-2"></div>
        <div id="invLoadMoreWrap" class="text-center py-5 hidden">
            <button type="button" onclick="renderMoreItems()"
                    class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider border transition"
                    style="border-color:#A38251; color:#252C32; background:#FFFFFF;">
                Mostrar más
            </button>
        </div>
    </main>

    <!-- MODAL DE VARIANTES Y DETALLE DE PRODUCTO -->
    <div id="productDetailModal" class="modal-backdrop" onclick="if(event.target===this) closeProductDetail()">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto shadow-2xl border" style="border-color:#E1DBC5;">
            <div class="sticky top-0 z-10 bg-white px-5 py-3.5 border-b flex items-center justify-between" style="border-color:#E8E4DE;">
                <div class="min-w-0 pr-3">
                    <div id="detGroupCrumb" onclick="backToCurrentGroupVariants()"
                         class="hidden text-[11px] font-extrabold tracking-wider uppercase cursor-pointer mb-0.5"
                         style="color:#A38251;"></div>
                    <div id="detSku" class="text-[11px] font-extrabold tracking-widest uppercase" style="color:#A38251;"></div>
                    <h2 id="detName" class="text-base sm:text-lg font-extrabold uppercase leading-snug" style="color:#252C32;"></h2>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button type="button" id="detAddCartBtn" onclick="addCurrentDetailToCart()"
                            class="px-3.5 py-2 rounded-full text-xs font-bold uppercase tracking-wider transition"
                            style="background:#A38251; color:#FFFFFF;">
                        + Cotización
                    </button>
                    <button type="button" onclick="closeProductDetail()"
                            class="w-9 h-9 rounded-full flex items-center justify-center text-lg font-light border"
                            style="border-color:#E8E4DE; color:#252C32;">✕</button>
                </div>
            </div>

            <!-- PASO 1 (SOLO CUANDO EL MODELO TIENE VARIANTES): LISTADO DE VARIANTES DISPONIBLES -->
            <div id="detVariantsStep" class="p-5 space-y-2 hidden">
                <div id="detVariantsList" class="space-y-2"></div>
            </div>

            <!-- PASO 2: VISTA DEL PRODUCTO / VARIANTE SELECCIONADA -->
            <div id="detSingleStep" class="p-5 space-y-5">
                <div class="w-full h-60 sm:h-72 rounded-xl border flex items-center justify-center overflow-hidden relative"
                     style="background:#FFFFFF; border-color:#E1DBC5;">
                    <img id="detPhotoImg" src="" alt="" class="w-full h-full object-contain hidden">
                    <div id="detPhotoEmpty" class="flex items-center justify-center select-none">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center border"
                             style="border-color:#E1DBC5; background:#E8E4DE; color:#A38251;">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="rounded-xl border p-4 space-y-3" style="border-color:#E1DBC5; background:#FFFFFF;">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div id="detPriceWrap" class="hidden flex items-center gap-2">
                            <span class="text-xs font-bold uppercase" style="color:#252C32;">Precio:</span>
                            <span id="detPrice" class="px-3 py-1 rounded-full text-sm font-black" style="background:#A38251; color:#FFFFFF;"></span>
                        </div>
                        <div class="flex items-center gap-2 ml-auto">
                            <span class="text-xs font-bold uppercase" style="color:#252C32;">Stock Total:</span>
                            <span id="detTotalStock" class="px-3 py-1 rounded-full text-sm font-black" style="background:#252C32; color:#FFFFFF;">0</span>
                        </div>
                    </div>

                    <div id="detWarehousesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
                </div>

                <div id="detSpecsWrap" class="rounded-xl border p-4 space-y-2.5 hidden" style="border-color:#E8E4DE; background:#FFFFFF;">
                    <div id="detSpecsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE COTIZACIÓN -->
    <div id="cartModal" class="modal-backdrop" onclick="if(event.target===this) closeCartModal()">
        <div class="bg-white rounded-2xl w-full max-w-lg max-h-[88vh] flex flex-col overflow-hidden shadow-2xl border" style="border-color:#E1DBC5;">
            <div class="px-5 py-4 border-b flex items-center justify-between" style="background:#252C32; color:#FFFFFF;">
                <h2 class="text-sm font-extrabold uppercase tracking-wider">Cotización</h2>
                <button type="button" onclick="closeCartModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-white/80 hover:text-white text-lg">✕</button>
            </div>
            <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-2.5"></div>
            <div id="cartTotalBar" class="px-4 py-2.5 border-t flex items-center justify-between text-xs font-extrabold uppercase hidden" style="border-color:#E8E4DE; background:#FAFAFA; color:#252C32;">
                <span>Total Cotización:</span>
                <span id="cartTotalAmount" class="text-sm font-black" style="color:#A38251;">$0.00</span>
            </div>
            <div class="p-4 border-t flex items-center justify-between gap-2" style="border-color:#E8E4DE; background:#FFFFFF;">
                <button type="button" onclick="clearCart()" class="px-3.5 py-2 rounded-lg text-xs font-bold border" style="border-color:#E1DBC5; color:#252C32;">
                    Vaciar
                </button>
                <button type="button" onclick="copyCartSummary()" id="copyCartBtn" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider" style="background:#A38251; color:#FFFFFF;">
                    Copiar Cotización
                </button>
            </div>
        </div>
    </div>

    <script src="creata-finishes.js?v=27"></script>
    <script src="creata-img.js?v=27"></script>
    <script src="creata-cloud.js?v=27"></script>
    <script src="inventario-data-1.js?v=27"></script>
    <script src="inventario-data-2.js?v=27"></script>
    <script src="inventario-data-3.js?v=27"></script>
    <script src="inventario-app.js?v=27"></script>
</body>
</html>
