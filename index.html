<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATA MUEBLES — Catálogo Oficial 2026</title>
    <!-- TIPOGRAFÍA OFICIAL RALEWAY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="catalog-styles.css?v=24">
</head>
<body>

    <!-- CABECERA -->
    <header class="sticky top-0 z-40">
        <div class="max-w-[1408px] mx-auto px-6 pt-6 pb-5 relative">

            <!-- LOGO OFICIAL EN BLANCO (INTACTO, CON MAYOR SEPARACIÓN INFERIOR) -->
            <div class="text-center mb-6">
                <img id="headerLogoImg" src="" alt="CREATA MUEBLES" class="logo-img">
                <script src="creata-logo.js"></script>
                <script>if(window.CREATA_LOGO_B64){document.getElementById("headerLogoImg").src=window.CREATA_LOGO_B64;}</script>
            </div>

            <!-- BARRA DE BÚSQUEDA INTELIGENTE DEL CLIENTE -->
            <div class="catalog-search-wrap">
                <div class="catalog-search-box">
                    <svg class="catalog-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z"></path>
                    </svg>
                    <input
                        type="search"
                        id="searchInput"
                        class="catalog-search-input"
                        placeholder="Buscar mueble, categoría, tela, madera, material o medida..."
                        autocomplete="off"
                        aria-label="Buscar en el catálogo"
                        oninput="handlePublicSearch(this.value)"
                        onkeydown="if(event.key === 'Escape'){ clearPublicSearch(); }"
                    >
                    <button
                        type="button"
                        id="clearSearchBtn"
                        class="catalog-search-clear"
                        style="display:none;"
                        onclick="clearPublicSearch()"
                        title="Limpiar búsqueda"
                    >✕</button>
                </div>
            </div>

            <!-- BARRA DE CATEGORÍAS (20% MÁS PEQUEÑAS) -->
            <div class="flex items-center justify-center flex-wrap gap-2" id="categoryBar">
                <button onclick="setFilter('ALL')" data-cat="ALL" id="flt-ALL" class="pill-btn active">TODOS (47)</button>
                <button onclick="setFilter('SALAS & SOFÁS')" data-cat="SALAS & SOFÁS" id="flt-SALAS-SOF-S" class="pill-btn">SALAS & SOFÁS (13)</button>
                <button onclick="setFilter('SILLAS & SILLONES')" data-cat="SILLAS & SILLONES" id="flt-SILLAS-SILLONES" class="pill-btn">SILLAS & SILLONES (11)</button>
                <button onclick="setFilter('COMEDORES')" data-cat="COMEDORES" id="flt-COMEDORES" class="pill-btn">COMEDORES (3)</button>
                <button onclick="setFilter('BUFETERAS & CREDENZAS')" data-cat="BUFETERAS & CREDENZAS" id="flt-BUFETERAS-CREDENZAS" class="pill-btn">BUFETERAS & CREDENZAS (7)</button>
                <button onclick="setFilter('MESAS DE CENTRO & LATERALES')" data-cat="MESAS DE CENTRO & LATERALES" id="flt-MESAS-DE-CENTRO-LATERALES" class="pill-btn">MESAS DE CENTRO & LATERALES (4)</button>
                <button onclick="setFilter('RECÁMARAS')" data-cat="RECÁMARAS" id="flt-REC-MARAS" class="pill-btn">RECÁMARAS (14)</button>
                <button onclick="setFilter('COMPLEMENTOS')" data-cat="COMPLEMENTOS" id="flt-COMPLEMENTOS" class="pill-btn">COMPLEMENTOS (4)</button>
            </div>
        </div>
    </header>

    <!-- CUADRÍCULA DE PRODUCTOS -->
    <main class="catalog-container mx-auto px-6 py-7">
        <div class="mb-5">
            <h2 id="activeCategoryTitle" class="text-xs font-bold tracking-widest text-[#252C32] uppercase">TODOS LOS MUEBLES</h2>
        </div>

        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- MODAL DE FICHA TÉCNICA CERO SCROLLBAR -->
        <!-- MODAL FICHA TÉCNICA CERO SCROLLBAR CON LAYOUT EXACTO DE 'FOTO DE REFERENCIA' -->
    <div id="slideModal" class="modal">
        <div class="modal-box">
            <!-- BOTÓN CERRAR -->
            <button type="button" onclick="closeModal()" class="modal-close-btn absolute top-3.5 right-3.5 z-50" title="Cerrar ventana">✕</button>

            <!-- CUERPO PRINCIPAL IDÉNTICO AL EDITOR (p-5 gap-6, lg:col-span-8 GALERÍA + lg:col-span-4 INFO) -->
            <div class="modal-body-grid flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-y-auto lg:overflow-hidden p-5 gap-6">
                
                <!-- COLUMNA IZQUIERDA: GALERÍA DE FOTOS MULTI-SLOT (MISMO ANCHO Y ALTURA EXACTA QUE EL EDITOR) -->
                <div class="lg:col-span-8 flex flex-col justify-between">
                    <div class="modal-gallery-grid">
                        <!-- #1 FOTO DEL AMBIENTE (TOP LEFT, 2 COLS X 2 ROWS) -->
                        <div class="gallery-slot slot-ambiente" onclick="openPhotoLightbox('ambiente')" title="Haz clic para ampliar foto">
                            <img id="slotImgAmbiente" draggable="false" src="" alt="Ambiente" class="w-full h-full object-contain">
                        </div>

                        <!-- #2 TELA / ACABADO VINCULADO AL BOTÓN DE MUESTRA -->
                        <div class="gallery-slot slot-finish" onclick="openPhotoLightbox('finish')" title="Haz clic para ampliar muestra de acabado">
                            <img id="slotImgFinish" draggable="false" src="" alt="Tela / Acabado" class="w-full h-full object-cover">
                        </div>

                        <!-- #3 FOTO DE VISTA 1 (MIDDLE RIGHT) -->
                        <div class="gallery-slot slot-view1" onclick="openPhotoLightbox('view1')" title="Haz clic para ampliar Vista 1">
                            <img id="slotImgView1" draggable="false" src="" alt="Vista 1" class="w-full h-full object-contain">
                        </div>

                        <!-- #4 FOTO DE VISTA 2 (BOTTOM LEFT) -->
                        <div class="gallery-slot slot-view2" onclick="openPhotoLightbox('view2')" title="Haz clic para ampliar Vista 2">
                            <img id="slotImgView2" draggable="false" src="" alt="Vista 2" class="w-full h-full object-contain">
                        </div>

                        <!-- #5 FOTO DE VISTA 3 (BOTTOM MIDDLE) -->
                        <div class="gallery-slot slot-view3" onclick="openPhotoLightbox('view3')" title="Haz clic para ampliar Vista 3">
                            <img id="slotImgView3" draggable="false" src="" alt="Vista 3" class="w-full h-full object-contain">
                        </div>

                        <!-- #6 FOTO DE VISTA 4 (BOTTOM RIGHT) -->
                        <div class="gallery-slot slot-view4" onclick="openPhotoLightbox('view4')" title="Haz clic para ampliar Vista 4">
                            <img id="slotImgView4" draggable="false" src="" alt="Vista 4" class="w-full h-full object-contain">
                        </div>
                    </div>
                </div>

                <!-- COLUMNA DERECHA: INFORMACIÓN EXACTA (lg:col-span-4 IDÉNTICO AL EDITOR) -->
                <div class="modal-info-column lg:col-span-4 flex flex-col justify-between h-full overflow-y-auto pr-1 space-y-3">
                    <div>
                        <!-- PROVEEDOR + CATEGORÍA (SIN SKU) -->
                        <div class="text-[10px] font-black text-[#A38251] tracking-widest uppercase mb-1 pr-8" id="modalProviderCat">CVV · SALAS & SOFÁS</div>
                        <!-- TÍTULO DINÁMICO EN MAYÚSCULAS -->
                        <h2 class="text-lg lg:text-xl font-black text-[#252C32] uppercase tracking-wide mb-2 leading-snug pr-6" id="modalTitle">-</h2>

                        <!-- 6 MEDIDAS EXACTAS EN CUADRÍCULA 3x2 -->
                        <div class="grid grid-cols-3 gap-2 text-center mb-2.5">
                            <div class="bg-white border border-[#E1DBC5] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Ancho</span>
                                <strong class="text-sm lg:text-base font-black text-[#252C32]" id="mWidth">-</strong>
                            </div>
                            <div class="bg-white border border-[#E1DBC5] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Fondo</span>
                                <strong class="text-sm lg:text-base font-black text-[#252C32]" id="mDepth">-</strong>
                            </div>
                            <div class="bg-white border border-[#E1DBC5] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Alto</span>
                                <strong class="text-sm lg:text-base font-black text-[#252C32]" id="mHeight">-</strong>
                            </div>
                            <div class="bg-white border border-[#E1DBC5] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Asiento</span>
                                <strong class="text-sm lg:text-base font-black text-[#252C32]" id="mSeat">-</strong>
                            </div>
                            <div class="bg-white border border-[#E1DBC5] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Bultos</span>
                                <strong class="text-sm lg:text-base font-black text-[#252C32]" id="mPackages">-</strong>
                            </div>
                            <div class="bg-white border border-[#E1DBC5] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Cubitaje</span>
                                <strong class="text-sm lg:text-base font-black text-[#252C32]" id="mVolume">-</strong>
                            </div>
                        </div>

                        <!-- PRECIO DE LISTA OFICIAL EN VERDE AMPLIADO -->
                        <div class="bg-[#EAF7EE] border border-green-200 rounded-xl px-4 py-2.5 flex items-center justify-between mb-2.5 shadow-xs">
                            <span class="text-xs font-black uppercase tracking-wider text-[#1B7A3E]">Precio de Lista Oficial:</span>
                            <span class="text-xl lg:text-2xl font-black text-[#1B7A3E]" id="mPrice">$0.00</span>
                        </div>

                        <!-- MATERIALES Y FABRICACIÓN AMPLIADO -->
                        <div class="bg-[#E8E4DE]/45 border border-[#E1DBC5] rounded-xl p-3 mb-2.5 shadow-xs">
                            <span class="text-[11px] font-black text-[#A38251] uppercase tracking-wider block mb-1.5">Materiales y Fabricación</span>
                            <p class="text-xs lg:text-[13px] text-[#252C32] leading-relaxed font-medium" id="mMaterials">-</p>
                        </div>

                        <!-- SELECTOR DE TELAS / ACABADOS (IDÉNTICO AL EDITOR) -->
                        <div class="flex flex-wrap items-center justify-center gap-2.5 my-2" id="modalSwatchesRow"></div>
                    </div>

                    <!-- BOTÓN DRIVE FICHA TÉCNICA PROMINENTE Y ANCHO COMPLETO -->
                    <div class="pt-2 w-full">
                        <a id="modalDriveBtn" href="#" target="_blank"
                           class="w-full py-3.5 px-6 rounded-xl bg-[#A38251] hover:bg-[#8B6D42] text-white text-sm font-black uppercase tracking-wider inline-flex items-center justify-center gap-2.5 shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5 active:translate-y-0 text-center">
                            <span class="text-base">📄</span> Ficha Técnica Oficial
                        </a>
                    </div>
                </div>
            </div>

            <!-- NAVEGACIÓN CONTINUA ENTRE MUEBLES -->
            <div class="bg-white border-t border-[#E1DBC5] px-6 py-2.5 flex items-center justify-between">
                <button onclick="prevProduct()" class="pill-btn !bg-white !text-[#252C32] !border-[#E1DBC5] hover:!border-[#A38251] shadow-sm">← Mueble Anterior</button>
                <button onclick="nextProduct()" class="pill-btn !bg-white !text-[#252C32] !border-[#E1DBC5] hover:!border-[#A38251] shadow-sm">Siguiente Mueble →</button>
            </div>
        </div>
    </div>

    <!-- VISOR DE ZOOM PANTALLA COMPLETA -->
    <div id="photoLightboxModal" onclick="closePhotoLightbox()">
        <button type="button" onclick="event.stopPropagation(); closePhotoLightbox();" class="modal-close-btn absolute top-5 right-5 z-50 !w-10 !h-10 !text-lg" title="Cerrar zoom">✕</button>
        <button type="button" id="lightboxPrevBtn" onclick="event.stopPropagation(); stepPhotoLightbox(-1);" class="lightbox-nav-btn left-4 sm:left-6" title="Foto anterior">‹</button>
        <img id="lightboxImgEl" src="" alt="Zoom" onclick="event.stopPropagation();">
        <button type="button" id="lightboxNextBtn" onclick="event.stopPropagation(); stepPhotoLightbox(1);" class="lightbox-nav-btn right-4 sm:right-6" title="Siguiente foto">›</button>
    </div>

    <script src="catalog-data-1.js?v=25"></script>
    <script src="catalog-data-2.js?v=25"></script>
    <script>const rawProducts = [...(window.CREATA_CATALOG_P1 || []), ...(window.CREATA_CATALOG_P2 || [])];</script>
    <script src="creata-finishes.js?v=25"></script>
    <script src="creata-img.js?v=25"></script>
    <script src="creata-cloud.js?v=25"></script>
    <script src="catalog-app.js?v=25"></script>
</body>
</html>
