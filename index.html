<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATA MUEBLES — Catálogo Oficial 2026</title>
    <!-- TIPOGRAFÍA OFICIAL RALEWAY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <link rel="stylesheet" href="catalog-styles.css">
</head>
<body>

    <!-- CABECERA -->
    <header class="sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 pt-6 pb-4 relative">

            <!-- LOGO OFICIAL EN BLANCO -->
            <div class="text-center mb-4">
                <img id="headerLogoImg" src="" alt="CREATA MUEBLES" class="logo-img">
                <script src="creata-logo.js"></script>
                <script>if(window.CREATA_LOGO_B64){document.getElementById("headerLogoImg").src=window.CREATA_LOGO_B64;}</script>
            </div>

            <!-- BARRA DE CATEGORÍAS (20% MÁS PEQUEÑAS) -->
            <div class="flex items-center justify-center flex-wrap gap-2" id="categoryBar">
                <button onclick="setFilter('ALL')" data-cat="ALL" id="flt-ALL" class="pill-btn active">TODOS (47)</button>
                <button onclick="setFilter('SALAS & SOFÁS')" data-cat="SALAS & SOFÁS" id="flt-SALAS-SOF-S" class="pill-btn">SALAS & SOFÁS (13)</button>
                <button onclick="setFilter('SILLAS & SILLONES')" data-cat="SILLAS & SILLONES" id="flt-SILLAS-SILLONES" class="pill-btn">SILLAS & SILLONES (11)</button>
                <button onclick="setFilter('COMEDORES')" data-cat="COMEDORES" id="flt-COMEDORES" class="pill-btn">COMEDORES (3)</button>
                <button onclick="setFilter('BUFETERAS & CREDENZAS')" data-cat="BUFETERAS & CREDENZAS" id="flt-BUFETERAS-CREDENZAS" class="pill-btn">BUFETERAS & CREDENZAS (7)</button>
                <button onclick="setFilter('MESAS DE CENTRO')" data-cat="MESAS DE CENTRO" id="flt-MESAS-DE-CENTRO" class="pill-btn">MESAS DE CENTRO (4)</button>
                <button onclick="setFilter('RECÁMARAS')" data-cat="RECÁMARAS" id="flt-REC-MARAS" class="pill-btn">RECÁMARAS (14)</button>
                <button onclick="setFilter('COMPLEMENTOS')" data-cat="COMPLEMENTOS" id="flt-COMPLEMENTOS" class="pill-btn">COMPLEMENTOS (4)</button>
            </div>
        </div>
    </header>

    <!-- CUADRÍCULA DE 51+ PRODUCTOS -->
    <main class="catalog-container max-w-7xl mx-auto px-6 py-6">
        <div class="mb-4">
            <h2 id="activeCategoryTitle" class="text-xs font-bold tracking-widest text-[#F1F5F9] uppercase">TODOS LOS MUEBLES</h2>
        </div>

        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- MODAL DE FICHA TÉCNICA CERO SCROLLBAR -->
        <!-- MODAL FICHA TÉCNICA CERO SCROLLBAR CON LAYOUT EXACTO DE 'FOTO DE REFERENCIA' -->
    <div id="slideModal" class="modal">
        <div class="modal-box">
            <!-- BOTÓN CERRAR -->
            <button onclick="closeModal()" class="absolute top-4 right-4 z-50 text-gray-400 hover:text-black text-2xl font-light leading-none">✕</button>

            <!-- CUERPO PRINCIPAL (2 COLUMNAS EN PC, 1 EN MÓVIL) -->
            <div class="flex-1 overflow-y-auto px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- COLUMNA IZQUIERDA: GALERÍA DE FOTOS MULTI-SLOT SEGÚN 'FOTO DE REFERENCIA' -->
                <div class="lg:col-span-7 flex flex-col justify-between">
                    <div class="modal-gallery-grid">
                        <!-- #3F48CC FOTO DEL AMBIENTE (TOP LEFT, 2 COLS X 2 ROWS) -->
                        <div class="gallery-slot slot-ambiente" onclick="cycleMainPhoto()" title="Haz clic para pasar a la siguiente foto o regresar a Ambiente">
                            
                            <img id="slotImgAmbiente" src="" alt="Ambiente" class="w-full h-full object-contain bg-white">
                        </div>

                        <!-- ACABADOS DINÁMICOS (1 O 2 RECUADROS SEPARADOS: TELA / MADERA) -->
                        <div class="gallery-slot slot-finish" onclick="swapToMain('finish')" title="Acabado / Detalle">
                            <img id="slotImgFinish" src="" alt="Acabado" class="w-full h-full object-contain p-1.5 bg-white">
                        </div>

                        <!-- #22B14C FOTO DE VISTA 1 (MIDDLE RIGHT) -->
                        <div class="gallery-slot slot-view1" onclick="swapToMain('view1')">
                            
                            <img id="slotImgView1" src="" alt="Vista 1" class="w-full h-full object-contain p-1.5 bg-white">
                        </div>

                        <!-- #22B14C FOTO DE VISTA 2 (BOTTOM LEFT) -->
                        <div class="gallery-slot slot-view2" onclick="swapToMain('view2')">
                            
                            <img id="slotImgView2" src="" alt="Vista 2" class="w-full h-full object-contain p-2">
                        </div>

                        <!-- #22B14C FOTO DE VISTA 3 (BOTTOM MIDDLE) -->
                        <div class="gallery-slot slot-view3" onclick="swapToMain('view3')">
                            
                            <img id="slotImgView3" src="" alt="Vista 3" class="w-full h-full object-contain p-2">
                        </div>

                        <!-- #22B14C FOTO DE VISTA 4 (BOTTOM RIGHT) -->
                        <div class="gallery-slot slot-view4" onclick="swapToMain('view4')">
                            
                            <img id="slotImgView4" src="" alt="Vista 4" class="w-full h-full object-contain p-2">
                        </div>
                    </div>
                </div>

                <!-- COLUMNA DERECHA: INFORMACIÓN EXACTA SEGÚN 'FOTO DE REFERENCIA' -->
                <div class="lg:col-span-5 flex flex-col justify-between h-full space-y-4">
                    <div>
                        <!-- PROVEEDOR + CATEGORÍA (SIN SKU) -->
                        <div class="text-[10px] font-black text-[#B8893E] tracking-widest uppercase mb-1" id="modalProviderCat">CVV · SALAS & SOFÁS</div>
                        <!-- TÍTULO DINÁMICO EN MAYÚSCULAS -->
                        <h2 class="text-lg lg:text-xl font-black text-[#0F172A] uppercase tracking-wide mb-2 leading-snug" id="modalTitle">-</h2>

                        <!-- 6 MEDIDAS EXACTAS EN CUADRÍCULA 3x2 (20% MÁS COMPACTA) -->
                        <div class="grid grid-cols-3 gap-2 text-center mb-2.5">
                            <div class="bg-white border border-[#CBD5E1] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Ancho</span>
                                <strong class="text-sm lg:text-base font-black text-slate-800" id="mWidth">-</strong>
                            </div>
                            <div class="bg-white border border-[#CBD5E1] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Fondo</span>
                                <strong class="text-sm lg:text-base font-black text-slate-800" id="mDepth">-</strong>
                            </div>
                            <div class="bg-white border border-[#CBD5E1] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Alto</span>
                                <strong class="text-sm lg:text-base font-black text-slate-800" id="mHeight">-</strong>
                            </div>
                            <div class="bg-white border border-[#CBD5E1] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Asiento</span>
                                <strong class="text-sm lg:text-base font-black text-slate-800" id="mSeat">-</strong>
                            </div>
                            <div class="bg-white border border-[#CBD5E1] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Bultos</span>
                                <strong class="text-sm lg:text-base font-black text-slate-800" id="mPackages">-</strong>
                            </div>
                            <div class="bg-white border border-[#CBD5E1] p-2 rounded-lg shadow-xs flex flex-col justify-center items-center">
                                <span class="block text-[8px] font-extrabold uppercase tracking-wider text-slate-400 mb-0.5">Cubitaje</span>
                                <strong class="text-sm lg:text-base font-black text-slate-800" id="mVolume">-</strong>
                            </div>
                        </div>

                        <!-- PRECIO DE LISTA OFICIAL EN VERDE AMPLIADO -->
                        <div class="bg-[#EAF7EE] border border-green-200 rounded-xl px-4 py-2.5 flex items-center justify-between mb-2.5 shadow-xs">
                            <span class="text-xs font-black uppercase tracking-wider text-[#1B7A3E]">Precio de Lista Oficial:</span>
                            <span class="text-xl lg:text-2xl font-black text-[#1B7A3E]" id="mPrice">$0.00</span>
                        </div>

                        <!-- MATERIALES Y FABRICACIÓN AMPLIADO -->
                        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-2.5 shadow-xs">
                            <span class="text-[11px] font-black text-[#B8893E] uppercase tracking-wider block mb-1.5">Materiales y Fabricación</span>
                            <p class="text-xs lg:text-[13px] text-slate-700 leading-relaxed font-medium" id="mMaterials">-</p>
                        </div>

                        <!-- SELECTOR DE TELAS / ACABADOS -->
                        <div class="flex flex-wrap items-center justify-start gap-1.5 mb-2.5" id="modalSwatchesRow"></div>
                    </div>

                    <!-- BOTÓN DRIVE FICHA TÉCNICA PROMINENTE Y ANCHO COMPLETO -->
                    <div class="pt-2 w-full">
                        <a id="modalDriveBtn" href="#" target="_blank"
                           class="w-full py-3.5 px-6 rounded-xl bg-[#B8893E] hover:bg-[#9E7432] text-white text-sm font-black uppercase tracking-wider inline-flex items-center justify-center gap-2.5 shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5 active:translate-y-0 text-center">
                            <span class="text-base">📄</span> Ficha Técnica Oficial
                        </a>
                    </div>
                </div>
            </div>

            <!-- NAVEGACIÓN CONTINUA ENTRE MUEBLES -->
            <div class="bg-white border-t border-[#E2E8F0] px-6 py-2.5 flex items-center justify-between">
                <button onclick="prevProduct()" class="pill-btn !bg-white !text-gray-700 !border-gray-300 hover:!border-gray-500 shadow-sm">← Mueble Anterior</button>
                <button onclick="nextProduct()" class="pill-btn !bg-white !text-gray-700 !border-gray-300 hover:!border-gray-500 shadow-sm">Siguiente Mueble →</button>
            </div>
        </div>
    </div>

    <script src="catalog-data-1.js"></script>
    <script src="catalog-data-2.js"></script>
    <script>const rawProducts = [...(window.CREATA_CATALOG_P1 || []), ...(window.CREATA_CATALOG_P2 || [])];</script>
    <script src="catalog-app.js"></script>
</body>
</html>
