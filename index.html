<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATA MUEBLES — Catálogo Oficial 2026</title>
    <!-- TIPOGRAFÍA OFICIAL RALEWAY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <style>
        :root {
            --bg-page: #6B6B6B; /* COLOR OFICIAL #6B6B6B SOLICITADO */
            --card-bg: #FFFFFF; /* FONDO BLANCO PURO PARA TARJETAS */
            --card-border: #E2E8F0;
            --brand-gold: #B8893E;
            --brand-gold-hover: #9E7432;
            --brand-charcoal: #1F2429;
            --pill-bg: #F0F4F8;
            --pill-text: #1E293B;
            --title-color: #0F172A;
            --muted-text: #64748B;
        }
        * , *::before, *::after, button, input, select, textarea { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Raleway', sans-serif !important; font-variant-numeric: lining-nums; }
        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--bg-page); /* #6B6B6B */
            color: #FFFFFF;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--bg-page);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* LOGO OFICIAL 10% MÁS GRANDE (66px) EN BLANCO LUMINOSO */
        .logo-img {
            height: 73px; /* +10% MÁS GRANDE */
            width: auto;
            object-fit: contain;
            margin: 0 auto;
            display: block;
        }

        /* CATEGORÍAS 20% MÁS PEQUEÑAS (9px) */
        .pill-btn {
            font-family: 'Raleway', sans-serif;
            font-size: 7.5px; /* 20% MÁS PEQUEÑO */
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 11px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            color: #F1F5F9;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .pill-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #FFFFFF;
            color: #FFFFFF;
        }
        .pill-btn.active {
            background: var(--brand-gold);
            border-color: var(--brand-gold);
            color: #FFFFFF;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        /* TARJETA BLANCA PURA SIN EFECTOS */
        .product-card {
            background: var(--card-bg); /* #FFFFFF */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }
        .product-card:hover {
            border-color: rgba(255, 255, 255, 0.45);
        }

        .card-img-area {
            position: relative;
            height: 206px;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 14px;
        }
        .card-img-area img {
            width: 100%;
            height: 100%;
            max-height: 182px;
            object-fit: contain;
        }
        .product-card:hover .card-img-area img {
            width: 100%;
            height: 100%;
            max-height: 182px;
            object-fit: contain;
        }

        .badge-category {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--pill-bg);
            color: var(--pill-text);
            font-size: 7.5px; /* 20% MÁS PEQUEÑO */
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding: 2.5px 8px;
            border-radius: 9999px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            z-index: 10;
        }

        .card-footer-info {
            border-top: 1px solid #F1F5F9;
            padding: 14px 12px 16px 12px;
            text-align: center;
            background: #FFFFFF;
        }
        .card-product-title {
            font-size: 14px;
            font-weight: 700;
            color: #0F172A;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .card-swatches-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .swatch-circle {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
            display: inline-block;
        }
        .options-count-text {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted-text);
            margin-left: 4px;
        }

        /* MODAL RESPONSIVO CERO SCROLL VERTICAL EN PC */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: #FFFFFF;
            border-radius: 20px;
            width: 100%;
            max-width: 1440px; /* MODAL AMPLIADO PARA MAYOR PROTAGONISMO DE FOTOS */ /* MODAL AMPLIADO PARA MAYOR PROTAGONISMO DE FOTOS */ /* MODAL AMPLIADO PARA MAYOR PROTAGONISMO DE FOTOS */
            max-height: 96vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            position: relative;
            color: #0F172A;
        }

        .modal-photo-stage {
            height: 400px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #FFFFFF;
        }
        .modal-photo-stage img {
            max-height: 380px;
            max-width: 95%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .view-pill {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            color: #64748B;
            cursor: pointer;
        }
        .view-pill.active {
            background: var(--brand-charcoal);
            border-color: var(--brand-charcoal);
            color: #FFFFFF;
        }
    
        /* MODAL MULTI-FOTO AMPLIADO Y SIN EFECTOS DE MOVIMIENTO */
        .modal-gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 220px 220px 165px;
            gap: 12px;
            height: 631px;
            width: 100%;
        }
        .gallery-slot {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-slot:hover, .finish-subcard:hover {
            border-color: #B8893E;
        }
        .slot-ambiente {
            grid-column: 1 / span 2;
            grid-row: 1 / span 2;
            height: 452px;
            background: #FFFFFF;
        }
        /* CONTENEDOR DINÁMICO DE ACABADOS */
        .slot-finishes-wrap, .slot-finish {
            grid-column: 3;
            grid-row: 1;
            height: 220px;
            width: 100%;
            display: grid;
            gap: 8px;
        }
        .slot-finishes-wrap.count-1 {
            grid-template-columns: 1fr;
        }
        .slot-finishes-wrap.count-2 {
            grid-template-columns: 1fr 1fr;
        }
        .finish-subcard {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .slot-view1 {
            grid-column: 3;
            grid-row: 2;
            height: 220px;
            background: #FFFFFF;
        }
        .slot-view2 {
            grid-column: 1;
            grid-row: 3;
            height: 165px;
            background: #FFFFFF;
        }
        .slot-view3 {
            grid-column: 2;
            grid-row: 3;
            height: 165px;
            background: #FFFFFF;
        }
        .slot-view4 {
            grid-column: 3;
            grid-row: 3;
            height: 165px;
            background: #FFFFFF;
        }
        .slot-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.7);
            color: #FFFFFF;
            backdrop-filter: blur(4px);
            z-index: 5;
            pointer-events: none;
        }
        .swatch-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 14px;
            border-radius: 9999px;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            color: #475569;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .swatch-pill:hover {
            border-color: #B8893E;
            color: #0F172A;
        }
        .swatch-pill.active {
            border-color: #B8893E;
            box-shadow: 0 0 0 1px #B8893E;
            font-weight: 800;
            color: #0F172A;
            background: #FFFDF9;
        }

    
        /* FLECHAS DE CARRUSEL PARA PRODUCTOS CON MÚLTIPLES VISTAS SIN LÍMITE */
        .views-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.72);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.2s ease;
        }
        .views-nav-btn:hover {
            background: #B8893E;
            transform: translateY(-50%) scale(1.1);
        }
        .views-counter-pill {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(15, 23, 42, 0.68);
            color: #FFFFFF;
            font-size: 8.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 9999px;
            z-index: 15;
            pointer-events: none;
        }

    
        .product-card:hover .card-img-area img {
            transform: scale(1.04) !important;
        }
        .card-img-area img.flipped {
            transform: scaleX(-1) !important;
        }

    
        /* NATIVE LAYOUT & RESPONSIVE FALLBACKS (PC + TELÉFONO) */
        .catalog-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 24px;
        }
        #grid {
            display: grid !important;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 22px;
            align-items: stretch;
        }
        .product-card {
            height: 100%;
            justify-content: space-between;
        }
        .card-img-area {
            position: relative;
            height: 215px !important;
            background: #FFFFFF !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 10px 14px !important;
            overflow: hidden;
        }
        .card-img-area img {
            width: 100% !important;
            height: 100% !important;
            max-height: 192px !important;
            object-fit: contain !important;
            object-position: center bottom !important;
            mix-blend-mode: multiply;
            transition: transform 0.27s cubic-bezier(0.4, 0, 0.2, 1) !important;
            transform-origin: center center !important;
        }
        .product-card:hover .card-img-area img {
            transform: scale(1.04) !important;
        }
        .card-img-area img.flipped {
            transform: scaleX(-1) scale(1.03) !important;
        }

        /* MODAL BODY LAYOUT (PC 2 COLS, MOBILE 1 COL) */
        .modal-body-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 7fr 5fr;
            gap: 24px;
            padding: 24px;
            overflow: hidden;
        }

        /* TABLET (640px - 1023px) */
        @media (max-width: 1023px) {
            #grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }
            .modal-box {
                max-height: 92vh !important;
            }
            .modal-body-grid {
                grid-template-columns: 1fr;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
                padding: 18px;
                gap: 18px;
            }
            .modal-gallery-grid {
                height: auto !important;
                grid-template-rows: 160px 160px 125px !important;
            }
            .slot-ambiente {
                height: 332px !important;
            }
            .slot-finishes-wrap, .slot-finish, .slot-view1 {
                height: 160px !important;
            }
            .slot-view2, .slot-view3, .slot-view4 {
                height: 125px !important;
            }
        }

        /* TELÉFONO MÓVIL (< 640px) */
        @media (max-width: 639px) {
            .catalog-container {
                padding: 12px 10px;
            }
            .logo-img {
                height: 54px !important;
            }
            #categoryBar {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: flex-start !important;
                padding-bottom: 6px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            #categoryBar::-webkit-scrollbar {
                display: none;
            }
            .pill-btn {
                flex-shrink: 0;
                font-size: 8.5px !important;
                padding: 6px 12px !important;
            }
            #grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }
            .product-card {
                border-radius: 12px;
            }
            .card-img-area {
                height: 148px !important;
                padding: 8px 6px !important;
            }
            .card-img-area img {
                max-height: 130px !important;
            }
            .badge-category {
                top: 6px !important;
                left: 6px !important;
                font-size: 6.5px !important;
                padding: 2px 6px !important;
            }
            .card-footer-info {
                padding: 8px 6px 10px 6px !important;
            }
            .card-product-title {
                font-size: 11px !important;
                line-height: 1.25;
                margin-bottom: 4px !important;
            }
            .swatch-circle {
                width: 11px !important;
                height: 11px !important;
            }
            .options-count-text {
                font-size: 9.5px !important;
            }
            .modal {
                padding: 8px !important;
            }
            .modal-box {
                border-radius: 16px !important;
                max-height: 94vh !important;
            }
            .modal-body-grid {
                padding: 14px 12px !important;
                gap: 14px !important;
            }
            .modal-gallery-grid {
                grid-template-columns: 1fr 1fr 1fr !important;
                grid-template-rows: 120px 120px 95px !important;
                gap: 6px !important;
                height: auto !important;
            }
            .slot-ambiente {
                height: 246px !important;
            }
            .slot-finishes-wrap, .slot-finish, .slot-view1 {
                height: 120px !important;
            }
            .slot-view2, .slot-view3, .slot-view4 {
                height: 95px !important;
            }
            #modalSwatchesRow {
                flex-wrap: wrap !important;
                gap: 6px !important;
            }
            .swatch-pill {
                font-size: 9.5px !important;
                padding: 5px 10px !important;
            }
        }

    </style>
</head>

    <script>
        const rawProducts = [];

        // INDEXEDDB DATABASE SYNC
        const DB_NAME = 'CreataCatalogDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'products_store';

        function openCatalogDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadCustomProducts() {
            try {
                const db = await openCatalogDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get('catalog_data');
                const res = await new Promise((resolve, reject) => {
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                if (res && Array.isArray(res) && res.length > 0) {
                    return res;
                }
            } catch (e) {
                console.warn('[Sync DB Error]', e);
            }
            return null;
        }

        let products = [];
        let currentFilter = 'ALL';
        let currentProdIndex = 0;
        let currentVariantIndex = 0;

        async function initializeCatalog() {
            // WIPE AUTOMÁTICO DE FICHAS ANTIGUAS: para dejar catálogo limpio e ingresar las correctas
            const WIPE_FLAG = 'creata_catalog_wiped_v3_clean';
            if (!localStorage.getItem(WIPE_FLAG)) {
                localStorage.setItem(WIPE_FLAG, 'true');
                try {
                    const db = await openCatalogDB();
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put([], 'catalog_data');
                    await new Promise(r => tx.oncomplete = r);
                    console.log('[Creata] Fichas antiguas eliminadas con éxito.');
                } catch (e) {
                    console.warn('[Creata Wipe Error]', e);
                }
            }
            const custom = await loadCustomProducts();
            const sourceList = custom || rawProducts;
            products = sourceList.filter(p =>
                p.drive_ficha_url &&
                p.width && p.width !== 'N/D' &&
                p.depth && p.depth !== 'N/D' &&
                p.height && p.height !== 'N/D' &&
                p.price && !p.price.includes('Consultar')
            );
            updateCategoryCounts();
            setFilter(currentFilter);
            const savedLogo = localStorage.getItem('creata_custom_logo');
            if (savedLogo) {
                const logoEl = document.getElementById('headerLogoImg');
                if (logoEl) logoEl.src = savedLogo;
            }
        }

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', initializeCatalog);
        } else {
            initializeCatalog();
        }


        function updateCategoryCounts() {
            const activeProds = products.filter(p => !p.archived);

            const setBtnText = (id, label, count) => {
                const btn = document.getElementById(id);
                if (btn) btn.innerText = `${label} (${count})`;
            };

            setBtnText('flt-ALL', 'TODOS', activeProds.length);
            setBtnText('flt-SALAS-SOF-S', 'SALAS & SOFÁS', activeProds.filter(p => p.category === 'SALAS & SOFÁS').length);
            setBtnText('flt-SILLAS-SILLONES', 'SILLAS & SILLONES', activeProds.filter(p => p.category === 'SILLAS & SILLONES').length);
            setBtnText('flt-COMEDORES', 'COMEDORES', activeProds.filter(p => p.category === 'COMEDORES').length);
            setBtnText('flt-BUFETERAS-CREDENZAS', 'BUFETERAS & CREDENZAS', activeProds.filter(p => p.category === 'BUFETERAS & CREDENZAS').length);
            setBtnText('flt-MESAS-DE-CENTRO', 'MESAS DE CENTRO', activeProds.filter(p => p.category === 'MESAS DE CENTRO').length);
            setBtnText('flt-REC-MARAS', 'RECÁMARAS', activeProds.filter(p => p.category === 'RECÁMARAS').length);
            setBtnText('flt-COMPLEMENTOS', 'COMPLEMENTOS', activeProds.filter(p => p.category === 'COMPLEMENTOS').length);
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('#categoryBar .pill-btn').forEach(btn => {
                const btnCat = btn.getAttribute('data-cat');
                btn.classList.toggle('active', btnCat === cat);
            });

            const searchEl = document.getElementById('searchInput');
            const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
            const titleEl = document.getElementById('activeCategoryTitle');
            const activeProds = products.filter(p => !p.archived);

            if (titleEl) {
                if (cat === 'ALL') {
                    titleEl.innerText = `TODOS LOS MUEBLES (${activeProds.length})`;
                } else {
                    const catCount = activeProds.filter(p => p.category === cat).length;
                    titleEl.innerText = `${cat} (${catCount})`;
                }
            }

            const filtered = products.filter(p => {
                if (p.archived) return false;
                const matchCat = (currentFilter === 'ALL' || p.category === currentFilter);
                const matchQ = !q || p.model_name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || (p.provider && p.provider.toLowerCase().includes(q));
                return matchCat && matchQ;
            });
            renderGrid(filtered);
        }

        function filterCatalog() {
            setFilter(currentFilter);
        }

        function renderGrid(items) {
            const grid = document.getElementById('grid');
            if (!grid) return;
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center flex flex-col items-center justify-center">
                        <div class="w-16 h-16 rounded-full bg-slate-800/60 border border-slate-700 flex items-center justify-center text-3xl mb-4">🛋️</div>
                        <h3 class="text-xl font-bold text-white mb-2">Próximamente nuevos modelos</h3>
                        <p class="text-sm text-slate-400 max-w-md">Catálogo en actualización. Los nuevos productos y colecciones estarán disponibles muy pronto.</p>
                    </div>
                `;
                return;
            }

            items.forEach((p) => {
                const realIdx = products.indexOf(p);
                const v = p.variants ? p.variants[0] : {};
                const card = document.createElement('div');
                card.className = 'product-card cursor-pointer';
                card.onclick = () => openModal(realIdx, 0);

                const imgId = `grid_card_img_${realIdx}`;

                const swatchesHtml = (p.variants || []).map((vItem, vIdx) => {
                    const hasImg = !!vItem.swatch_img;
                    const bgStyle = hasImg
                        ? `background-image: url('${vItem.swatch_img}'); background-size: cover; background-position: center;`
                        : `background-color: ${vItem.swatch_hex || '#B8893E'};`;
                    return `
                    <span onmouseenter="if(products[${realIdx}].variants[${vIdx}].hero_b64) document.getElementById('${imgId}').src = products[${realIdx}].variants[${vIdx}].hero_b64;"
                          onclick="event.stopPropagation(); if(products[${realIdx}].variants[${vIdx}].hero_b64) document.getElementById('${imgId}').src = products[${realIdx}].variants[${vIdx}].hero_b64; openModal(${realIdx}, ${vIdx});" 
                          title="${vItem.color_label || 'Opción'}" 
                          class="swatch-circle"
                          style="${bgStyle}"></span>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="card-img-area">
                        <span class="badge-category">${p.category}</span>
                        <img id="${imgId}" src="${v.hero_b64 || ''}" alt="${p.model_name}">
                    </div>
                    <div class="card-footer-info">
                        <div class="card-product-title">${p.model_name}</div>
                        <div class="card-swatches-row">
                            ${swatchesHtml}
                            <span class="options-count-text">${(p.variants || []).length} ${(p.variants || []).length === 1 ? 'opción' : 'opciones'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(prodIdx, variantIdx = 0, viewIdx = 0) {
            currentProdIndex = prodIdx;
            currentVariantIndex = variantIdx;
            currentViewIndex = viewIdx;
            updateModalView();
            document.getElementById('slideModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('slideModal').classList.remove('active');
        }

        let currentViewOffset = 0;
        let mainPhotoCycleIndex = -1;

        function updateModalView(resetOffset = true) {
            const p = products[currentProdIndex];
            if (!p) return;
            const v = (p.variants && p.variants[currentVariantIndex]) ? p.variants[currentVariantIndex] : (p.variants ? p.variants[0] : {});
            if (resetOffset) {
                currentViewOffset = 0;
                mainPhotoCycleIndex = -1;
            }

            document.getElementById('modalProviderCat').innerText = `${p.provider_abbr} · ${p.category}`;
            document.getElementById('modalTitle').innerText = p.model_name;

            const g = v.gallery || {
                ambiente: v.hero_b64,
                finishes: [v.hero_b64],
                all_views: [v.hero_b64]
            };

            const allViews = (g.all_views && g.all_views.length > 0)
                ? g.all_views
                : [g.view1 || v.hero_b64, g.view2 || v.hero_b64, g.view3 || v.hero_b64, g.view4 || v.hero_b64];

            document.getElementById('slotImgAmbiente').src = g.ambiente || v.hero_b64 || '';
            const finishSrc = (g.finishes && g.finishes.length > 0) ? g.finishes[0] : (g.fabric || '');
            const finishEl = document.getElementById('slotImgFinish');
            if (finishEl) {
                finishEl.className = "w-full h-full object-contain p-1.5 bg-white";
                if (finishSrc) {
                    finishEl.src = finishSrc;
                    finishEl.style.display = 'block';
                } else {
                    finishEl.style.display = 'none';
                }
            }
            document.getElementById('slotImgAmbiente').className = "w-full h-full object-contain bg-white transition-all duration-200";

            const vSlots = ['slotImgView1', 'slotImgView2', 'slotImgView3', 'slotImgView4'];
            vSlots.forEach((slotId, idx) => {
                const viewImg = allViews[(currentViewOffset + idx) % allViews.length];
                const el = document.getElementById(slotId);
                if (el) {
                    el.src = viewImg || '';
                    el.className = "w-full h-full object-contain p-1.5";
                }
            });

            const setSpecBox = (id, val) => {
                const el = document.getElementById(id);
                if (!el) return;
                const box = el.parentElement;
                const cleanVal = (val || '').toString().trim();
                if (!cleanVal || cleanVal === 'N/D' || cleanVal === '-' || cleanVal === 'None' || cleanVal === '0 cm' || cleanVal === '0 m³') {
                    if (box) box.style.display = 'none';
                } else {
                    if (box) box.style.display = '';
                    el.innerText = cleanVal;
                }
            };
            setSpecBox('mWidth', v.width || p.width);
            setSpecBox('mDepth', v.depth || p.depth);
            setSpecBox('mHeight', v.height || p.height);
            setSpecBox('mSeat', v.seat || p.seat);
            setSpecBox('mPackages', v.packages || p.packages);
            setSpecBox('mVolume', v.volume || p.volume);

            document.getElementById('mPrice').innerText = p.price || 'Consultar';
            document.getElementById('mMaterials').innerText = v.materials || p.materials || 'Materiales de alta durabilidad y estructura reforzada.';

            const swatchesRow = document.getElementById('modalSwatchesRow');
            if (swatchesRow && p.variants) {
                swatchesRow.innerHTML = p.variants.map((vItem, vIdx) => {
                    const hasImg = !!vItem.swatch_img;
                    const thumb = hasImg
                        ? `<span class="w-4 h-4 rounded-full inline-block border border-black/20 shadow-sm bg-cover bg-center shrink-0" style="background-image: url('${vItem.swatch_img}');"></span>`
                        : `<span class="w-4 h-4 rounded-full inline-block border border-black/20 shadow-sm shrink-0" style="background: ${vItem.swatch_hex || '#B8893E'};"></span>`;
                    return `
                    <button onclick="currentVariantIndex = ${vIdx}; updateModalView(true);"
                            title="${vItem.color_label || 'Opción'}"
                            class="swatch-pill ${vIdx === currentVariantIndex ? 'active' : ''} flex items-center gap-1.5 px-3 py-1 rounded-full border">
                        ${thumb}
                        <span class="text-[10px] font-bold uppercase tracking-wider">${vItem.color_label || 'Opción'}</span>
                    </button>
                    `;
                }).join('');
            }

            const driveBtn = document.getElementById('modalDriveBtn');
            if (driveBtn) {
                driveBtn.href = p.drive_ficha_url || '#';
            }
        }

        function cycleMainPhoto() {
            const p = products[currentProdIndex];
            const v = p.variants[currentVariantIndex];
            const g = v.gallery || {};
            const allViews = g.all_views || [];
            if (allViews.length === 0) return;

            mainPhotoCycleIndex = (mainPhotoCycleIndex + 1) % (allViews.length + 1);
            const mainImg = document.getElementById('slotImgAmbiente');
            if (mainPhotoCycleIndex === -1 || mainPhotoCycleIndex >= allViews.length) {
                mainImg.src = g.ambiente || v.hero_b64;
                mainPhotoCycleIndex = -1;
            } else {
                mainImg.src = allViews[mainPhotoCycleIndex];
            }
        }

        
                function swapToMain(slotName) {
            if (slotName === 'finish') {
                const finishEl = document.getElementById('slotImgFinish');
                if (finishEl && finishEl.src) {
                    document.getElementById('slotImgAmbiente').src = finishEl.src;
                }
                return;
            }
            const p = products[currentProdIndex];
            const v = p.variants[currentVariantIndex];
            const g = v.gallery || {};
            const allViews = g.all_views || [];
            let targetIdx = 0;
            if (slotName === 'view1') targetIdx = 0;
            if (slotName === 'view2') targetIdx = 1;
            if (slotName === 'view3') targetIdx = 2;
            if (slotName === 'view4') targetIdx = 3;
            const chosenView = allViews[(currentViewOffset + targetIdx) % allViews.length] || g[slotName];
            if (chosenView) {
                document.getElementById('slotImgAmbiente').src = chosenView;
            }
        }

        function prevProduct() {
            currentProdIndex = (currentProdIndex - 1 + products.length) % products.length;
            currentVariantIndex = 0;
            updateModalView();
        }

        function nextProduct() {
            currentProdIndex = (currentProdIndex + 1) % products.length;
            currentVariantIndex = 0;
            updateModalView();
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('slideModal').classList.contains('active')) return;
            if (e.key === 'ArrowRight') nextProduct();
            if (e.key === 'ArrowLeft') prevProduct();
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
